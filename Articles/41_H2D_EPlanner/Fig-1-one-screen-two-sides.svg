      <rect x="430" y="404" width="12" height="22"/><rect x="448" y="396" width="12" height="30"/>
      <rect x="466" y="410" width="12" height="16"/><rect x="484" y="390" width="12" height="36"/>
      <rect x="502" y="400" width="12" height="26"/><rect x="520" y="414" width="12" height="12"/>
      <rect x="538" y="394" width="12" height="32"/><rect x="556" y="406" width="12" height="20"/>
      <rect x="574" y="398" width="12" height="28"/><rect x="592" y="412" width="12" height="14"/>
      <rect x="610" y="392" width="12" height="34"/><rect x="628" y="402" width="12" height="24"/>
      <rect x="646" y="408" width="12" height="18"/><rect x="664" y="396" width="12" height="30"/>
