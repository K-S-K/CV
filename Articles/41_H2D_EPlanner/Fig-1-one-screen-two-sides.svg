    </g>
    <polyline points="436,394 454,402 472,390 490,410 508,398 526,388 544,408 562,396 580,400 598,388 616,412 634,398 652,392 670,404 688,396" fill="none" stroke="#059669" stroke-width="2"/>
    <rect x="727" y="364" width="175" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="735" y="379" class="t10">EEX Hydrix — market reference</text>
    <line x1="737" y1="408" x2="892" y2="408" stroke="#64748b" stroke-width="2"/>
    <text x="737" y="425" class="t10">not part of this calculation</text>
  </g>

  <!-- pending bar -->
  <rect x="418" y="442" width="484" height="38" rx="9" fill="#fffbeb" stroke="#d97706"/>
  <text x="432" y="466" class="t12 b" style="fill:#92400e">2 changes not applied yet</text>
  <rect x="686" y="449" width="102" height="24" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="737" y="465" text-anchor="middle" class="t11">Discard changes</text>
  <rect x="794" y="449" width="100" height="24" rx="7" fill="#1d4ed8"/>
  <text x="844" y="465" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">Apply changes</text>

  <!-- callout markers -->
  <g class="t11 wht b">
    <circle cx="378" cy="204" r="10" fill="#0f172a"/><text x="378" y="208" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">1</text>
    <circle cx="382" cy="336" r="10" fill="#0f172a"/><text x="382" y="340" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">2</text>
    <circle cx="382" cy="392" r="10" fill="#0f172a"/><text x="382" y="396" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">3</text>
    <circle cx="832" cy="166" r="10" fill="#0f172a"/><text x="832" y="170" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">4</text>
    <circle cx="906" cy="300" r="10" fill="#0f172a"/><text x="906" y="304" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">5</text>
    <circle cx="906" cy="442" r="10" fill="#0f172a"/><text x="906" y="446" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">6</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="42" cy="530" r="10" fill="#0f172a"/><text x="42" y="534" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">1</text>
    <text x="60" y="534" class="t12">One click on a size gives a full example</text>
    <circle cx="352" cy="530" r="10" fill="#0f172a"/><text x="352" y="534" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">2</text>
    <text x="370" y="534" class="t12">Every choice is a clickable chip</text>
    <circle cx="662" cy="530" r="10" fill="#0f172a"/><text x="662" y="534" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">3</text>
    <text x="680" y="534" class="t12">Project questions: permits, certificates</text>

    <circle cx="42" cy="560" r="10" fill="#0f172a"/><text x="42" y="564" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">4</text>
    <text x="60" y="564" class="t12">Keep variants, reopen them, compare two</text>
    <circle cx="352" cy="560" r="10" fill="#0f172a"/><text x="352" y="564" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">5</text>
    <text x="370" y="564" class="t12">Edit any value or set a target on a result</text>
    <circle cx="662" cy="560" r="10" fill="#0f172a"/><text x="662" y="564" text-anchor="middle" class="t11 wht b" style="fill:#ffffff">6</text>
    <text x="680" y="564" class="t12">Several edits, one recalculation</text>
  </g>
  <text x="32" y="600" class="t10">Schematic, not a screenshot. Figures: the Medium example (200 kg/h, EEX price profile). Faded figures are out of date until the changes are applied.</text>
</svg>
