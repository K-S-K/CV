    <rect x="418" y="300" width="90" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="426" y="317" class="t10">Total CapEx</text>
    <text x="426" y="342" class="val">€12.5M</text>
    <rect x="517" y="300" width="90" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="525" y="317" class="t10">Electricity</text>
    <text x="525" y="342" class="val">€301k/mo</text>
    <rect x="616" y="300" width="90" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="624" y="317" class="t10">H₂ produced</text>
    <text x="624" y="342" class="val">64.7 t/mo</text>
    <rect x="715" y="300" width="90" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="723" y="317" class="t10">CO₂ avoided</text>
    <text x="723" y="342" class="val">555 t/mo</text>
    <rect x="814" y="300" width="90" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="822" y="317" class="t10">Cost of H₂</text>
    <text x="822" y="342" class="val">€4.65/kg</text>
  </g>
  <g class="t11 blu">
    <text x="497" y="317" class="t11 blu">✎</text>
